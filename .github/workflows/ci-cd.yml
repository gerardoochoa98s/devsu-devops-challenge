name: CI/CD

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '20'

jobs:
    quality:
        name: Lint, tests and coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Static analysis (ESLint)
              run: npm run lint

            - name: Format check (Prettier)
              run: npm run format:check

            - name: Unit tests and coverage
              run: npm run test:coverage

            - name: Add coverage summary
              if: always()
              run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

            - name: Upload coverage and test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: |
                      coverage/
                      reports/
                  retention-days: 14
                  if-no-files-found: warn

            - name: Dependency audit (informational)
              continue-on-error: true
              run: npm audit --omit=dev --audit-level=high

    codeql:
        name: CodeQL (SAST)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: javascript-typescript
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@v3
              with:
                  category: '/language:javascript-typescript'

    build:
        name: Build, scan and push image
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs:
            - quality
        permissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compute lowercase image name
              run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=sha-,format=long
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build timestamp
              id: buildmeta
              run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Build image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  load: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      VERSION=${{ steps.meta.outputs.version }}
                      VCS_REF=${{ github.sha }}
                      BUILD_DATE=${{ steps.buildmeta.outputs.date }}

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
                  format: sarif
                  output: trivy-results.sarif
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: '1'

            - name: Upload Trivy results to the Security tab
              if: always() && hashFiles('trivy-results.sarif') != ''
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: trivy-results.sarif
                  category: trivy

            - name: Push image to GHCR
              if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
                    if [ -n "${tag}" ]; then
                      docker push "${tag}"
                    fi
                  done

    deploy:
        name: Deploy to Kubernetes (kind)
        runs-on: ubuntu-latest
        timeout-minutes: 35
        needs:
            - build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        environment:
            name: local-kubernetes
        permissions:
            contents: read
            packages: read
        env:
            IMAGE_TAG: sha-${{ github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compute lowercase image name
              run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Create kind cluster
              uses: helm/kind-action@v1.10.0
              with:
                  cluster_name: demo-devops
                  config: .github/kind-config.yaml

            - name: Install ingress-nginx
              run: |
                  kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
                  kubectl wait --namespace ingress-nginx \
                    --for=condition=ready pod \
                    --selector=app.kubernetes.io/component=controller \
                    --timeout=240s

            - name: Install metrics-server
              run: |
                  kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
                  kubectl patch deployment metrics-server -n kube-system --type=json \
                    -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
                  kubectl wait --namespace kube-system \
                    --for=condition=available deployment/metrics-server \
                    --timeout=180s

            - name: Install local-path provisioner
              run: |
                  kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
                  kubectl wait --namespace local-path-storage \
                    --for=condition=available deployment/local-path-provisioner \
                    --timeout=180s
                  kubectl patch storageclass local-path \
                    -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

            - name: Install kustomize
              uses: imranismail/setup-kustomize@v3.0.0
              with:
                  version: 5.6.0

            - name: Create namespace and database secret
              run: |
                  kubectl apply -f k8s/base/namespace.yaml
                  DB_PASSWORD="$(openssl rand -hex 16)"
                  kubectl -n demo-devops create secret generic demo-devops-db \
                    --from-literal=DB_USER=devops \
                    --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
                    --dry-run=client -o yaml | kubectl apply -f -

            - name: Pull image and load it into kind
              run: |
                  echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
                  IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
                  docker pull "${IMAGE}"
                  kind load docker-image "${IMAGE}" --name demo-devops

            - name: Set the deployed image
              run: |
                  cd k8s/overlays/local
                  kustomize edit set image "demo-devops-api=${IMAGE_NAME}:sha-${GITHUB_SHA}"

            - name: Deploy manifests
              run: |
                  kubectl delete job demo-devops-migrate -n demo-devops --ignore-not-found
                  kubectl apply -k k8s/overlays/local

            - name: Wait for PostgreSQL and migrations
              run: |
                  kubectl -n demo-devops rollout status statefulset/demo-devops-postgres --timeout=240s
                  kubectl -n demo-devops wait --for=condition=complete job/demo-devops-migrate --timeout=180s

            - name: Wait for application rollout
              run: kubectl -n demo-devops rollout status deployment/demo-devops-api --timeout=240s

            - name: Smoke test through the ingress
              run: bash scripts/smoke-test.sh

            - name: Collect Kubernetes evidence
              if: always()
              run: bash scripts/collect-evidence.sh

            - name: Upload Kubernetes evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: k8s-evidence
                  path: docs/evidence/
                  retention-days: 30
                  if-no-files-found: warn

            - name: Publish job summary
              if: always()
              run: cat docs/evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
