apiVersion: v1
kind: Service
metadata:
    name: demo-devops-postgres
    namespace: demo-devops
    labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: demo-devops
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: postgres
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: demo-devops-postgres
    namespace: demo-devops
    labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: demo-devops
spec:
    serviceName: demo-devops-postgres
    replicas: 1
    podManagementPolicy: OrderedReady
    updateStrategy:
        type: RollingUpdate
    selector:
        matchLabels:
            app.kubernetes.io/name: postgres
    template:
        metadata:
            labels:
                app.kubernetes.io/name: postgres
                app.kubernetes.io/part-of: demo-devops
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: postgres
                  image: postgres:16.4-bookworm
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: postgres
                        containerPort: 5432
                  env:
                      - name: POSTGRES_DB
                        valueFrom:
                            configMapKeyRef:
                                name: demo-devops-config
                                key: DB_NAME
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: demo-devops-db
                                key: DB_USER
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: demo-devops-db
                                key: DB_PASSWORD
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                      - name: run
                        mountPath: /var/run/postgresql
                      - name: tmp
                        mountPath: /tmp
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: run
                  emptyDir: {}
                - name: tmp
                  emptyDir: {}
    volumeClaimTemplates:
        - metadata:
              name: data
              labels:
                  app.kubernetes.io/name: postgres
                  app.kubernetes.io/part-of: demo-devops
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 1Gi
