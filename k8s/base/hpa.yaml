apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: demo-devops-api
    namespace: demo-devops
    labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: demo-devops
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: demo-devops-api
    minReplicas: 2
    maxReplicas: 6
    behavior:
        scaleUp:
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
                - type: Percent
                  value: 100
                  periodSeconds: 15
                - type: Pods
                  value: 2
                  periodSeconds: 15
        scaleDown:
            stabilizationWindowSeconds: 60
            policies:
                - type: Percent
                  value: 50
                  periodSeconds: 60
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
        - type: Resource
          resource:
              name: memory
              target:
                  type: Utilization
                  averageUtilization: 80
