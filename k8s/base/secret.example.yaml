# Example only. Never commit real credentials.
# Create the real secret with:
#   kubectl -n demo-devops create secret generic demo-devops-db \
#     --from-literal=DB_USER=devops \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
#
# For production, prefer an external secret manager (External Secrets Operator,
# Sealed Secrets, SOPS, or the cloud provider's secret manager).
apiVersion: v1
kind: Secret
metadata:
    name: demo-devops-db
    namespace: demo-devops
type: Opaque
stringData:
    DB_USER: devops
    DB_PASSWORD: CHANGE_ME
