apiVersion: v1
kind: ConfigMap
metadata:
    name: demo-devops-config
    namespace: demo-devops
    labels:
        app.kubernetes.io/part-of: demo-devops
data:
    NODE_ENV: production
    PORT: '8000'
    HOST: 0.0.0.0
    APP_VERSION: local
    DB_DIALECT: postgres
    DB_HOST: demo-devops-postgres
    DB_PORT: '5432'
    DB_NAME: devops
    DB_SSL: 'false'
    DB_LOGGING: 'false'
