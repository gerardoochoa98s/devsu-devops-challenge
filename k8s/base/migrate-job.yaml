apiVersion: batch/v1
kind: Job
metadata:
    name: demo-devops-migrate
    namespace: demo-devops
    labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: demo-devops
spec:
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
    template:
        metadata:
            labels:
                app.kubernetes.io/name: migrate
                app.kubernetes.io/part-of: demo-devops
        spec:
            restartPolicy: Never
            serviceAccountName: demo-devops-api
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            initContainers:
                - name: wait-for-db
                  image: demo-devops-api:local
                  imagePullPolicy: IfNotPresent
                  command: ['node', 'scripts/wait-for-db.js']
                  envFrom:
                      - configMapRef:
                            name: demo-devops-config
                      - secretRef:
                            name: demo-devops-db
                  env:
                      - name: DB_WAIT_ATTEMPTS
                        value: '60'
                  resources:
                      requests:
                          cpu: 10m
                          memory: 32Mi
                      limits:
                          cpu: 100m
                          memory: 64Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            containers:
                - name: migrate
                  image: demo-devops-api:local
                  imagePullPolicy: IfNotPresent
                  command: ['node', 'scripts/migrate.js']
                  envFrom:
                      - configMapRef:
                            name: demo-devops-config
                      - secretRef:
                            name: demo-devops-db
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          cpu: 250m
                          memory: 128Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
