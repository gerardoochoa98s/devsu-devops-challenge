apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../../base

images:
    - name: demo-devops-api
      newName: ghcr.io/gerardoochoa98s/devsu-devops-challenge
      newTag: '1.0.0'

patches:
    - target:
          kind: Deployment
          name: demo-devops-api
      patch: |-
          - op: replace
            path: /spec/replicas
            value: 3
    - target:
          kind: HorizontalPodAutoscaler
          name: demo-devops-api
      patch: |-
          - op: replace
            path: /spec/maxReplicas
            value: 10
    - target:
          kind: Ingress
          name: demo-devops-api
      patch: |-
          - op: replace
            path: /spec/rules/0/host
            value: demo.example.com
          - op: add
            path: /spec/tls
            value:
              - hosts:
                  - demo.example.com
                secretName: demo-devops-tls
          - op: replace
            path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
            value: "true"
